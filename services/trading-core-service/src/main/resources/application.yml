spring:
  application:
    name: trading-core-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_saas}
    username: ${POSTGRES_USER:trading_user}
    password: ${POSTGRES_PASSWORD:dev_password_change_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: trading_core
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trading_core
    baseline-on-migrate: false
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

server:
  port: 8082
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

management:
  metrics:
    tags:
      service: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true
    diskspace:
      enabled: false

trading-core:
  internal-secret: ${INTERNAL_API_SECRET:${TRADING_CORE_INTERNAL_SECRET:}}
  reasoning:
    # C9 cutover flag. When `true` (default), the legacy in-process
    # ReasoningGenerationListener consumes signal.reasoning.requested
    # via Gemini+deterministic fallback. When `false`, ai-engine's
    # grounded pipeline (Track C) is the sole consumer. Flip to `false`
    # once staging confirms ai-engine handles the queue cleanly.
    legacy-listener:
      enabled: ${TRADING_CORE_REASONING_LEGACY_LISTENER_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    free-per-minute: ${RATE_LIMIT_FREE_PER_MINUTE:5}
    basic-per-minute: ${RATE_LIMIT_BASIC_PER_MINUTE:50}
    premium-per-minute: ${RATE_LIMIT_PREMIUM_PER_MINUTE:500}
  llm:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      timeout-seconds: 10
      max-output-tokens: 100
      temperature: 0.7
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.1-8b-instant}
      timeout-seconds: 10
      max-output-tokens: 100
      temperature: 0.7
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-256-bit-secret-in-production}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}
  redis:
    token-blacklist-prefix: "trading-core:blacklist:"
subscriptions:
  enforce: ${SUBSCRIPTIONS_ENFORCE:false}

services:
  market-data:
    url: ${MARKET_DATA_SERVICE_URL:http://localhost:8081}
    internal-secret: ${INTERNAL_API_SECRET:${MARKET_DATA_INTERNAL_SECRET:}}
