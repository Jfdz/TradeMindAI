name: Fix Trading Signals Duplicate Key Errors

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'yes' to confirm you want to delete duplicate signals and restart pods"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix-duplicates:
    name: Delete duplicate signals and restart pods
    if: github.event.inputs.confirmation == 'yes'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get postgres credentials and setup port-forward
        id: pg-creds
        run: |
          set -euo pipefail
          echo "Fetching postgres credentials from secret..."

          POSTGRES_HOST=$(kubectl get secret postgres-credentials -n trading-saas -o jsonpath='{.data.host}' | base64 -d)
          POSTGRES_PORT=$(kubectl get secret postgres-credentials -n trading-saas -o jsonpath='{.data.port}' | base64 -d)
          POSTGRES_USER=$(kubectl get secret postgres-credentials -n trading-saas -o jsonpath='{.data.username}' | base64 -d)
          POSTGRES_PASSWORD=$(kubectl get secret postgres-credentials -n trading-saas -o jsonpath='{.data.password}' | base64 -d)

          echo "host=${POSTGRES_HOST}" >> "$GITHUB_OUTPUT"
          echo "port=${POSTGRES_PORT}" >> "$GITHUB_OUTPUT"
          echo "user=${POSTGRES_USER}" >> "$GITHUB_OUTPUT"
          echo "password=${POSTGRES_PASSWORD}" >> "$GITHUB_OUTPUT"

          # Check if host is a k8s service name (contains .svc.cluster.local or similar)
          if [[ "${POSTGRES_HOST}" == *".svc.cluster.local"* ]] || [[ "${POSTGRES_HOST}" == *".svc"* ]]; then
            echo "Detected Kubernetes service name, will use port-forward"
            echo "use_portforward=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_portforward=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup postgres port-forward
        if: steps.pg-creds.outputs.use_portforward == 'true'
        run: |
          set -euo pipefail
          echo "Setting up port-forward to postgres service..."
          kubectl port-forward -n trading-saas svc/postgres 5432:5432 > /tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid

          # Wait for port-forward to be ready
          sleep 2
          for i in {1..10}; do
            if timeout 1 bash -c 'exec 3<>/dev/tcp/localhost/5432' 2>/dev/null; then
              echo "✓ Port-forward ready on localhost:5432"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "✗ Port-forward failed to start"
              cat /tmp/pf.log
              exit 1
            fi
            echo "Waiting for port-forward... ($i/10)"
            sleep 1
          done

      - name: Delete duplicate trading signals from database
        env:
          PGHOST: ${{ steps.pg-creds.outputs.use_portforward == 'true' && 'localhost' || steps.pg-creds.outputs.host }}
          PGPORT: 5432
          PGUSER: ${{ steps.pg-creds.outputs.user }}
          PGPASSWORD: ${{ steps.pg-creds.outputs.password }}
          PGDATABASE: trading_core
        run: |
          set -euo pipefail
          echo "Deleting duplicate signals from trading_core.trading_signals..."
          echo "Connecting to postgres at ${PGHOST}:${PGPORT}..."

          psql << 'SQL'
          DELETE FROM trading_core.trading_signals
          WHERE id IN (
            SELECT id FROM (
              SELECT id, ROW_NUMBER() OVER (
                PARTITION BY ticker, signal_type, timeframe, DATE(generated_at), entry_price
                ORDER BY generated_at DESC
              ) AS rn
              FROM trading_core.trading_signals
            ) t WHERE rn > 1
          );
          SQL

          echo "✓ Duplicates deleted"

      - name: Cleanup port-forward
        if: always()
        run: |
          if [ -f /tmp/pf.pid ]; then
            PID=$(cat /tmp/pf.pid)
            echo "Cleaning up port-forward (PID: ${PID})"
            kill ${PID} 2>/dev/null || true
            rm -f /tmp/pf.pid /tmp/pf.log
          fi

      - name: Restart trading-core-service deployment
        run: |
          set -euo pipefail
          echo "Restarting trading-core-service pods..."
          kubectl rollout restart deployment/trading-core-service -n trading-saas

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/trading-core-service -n trading-saas --timeout=5m

          echo "✓ Rollout complete"

      - name: Verify pods are healthy
        run: |
          set -euo pipefail
          echo "Checking pod status..."
          kubectl get pods -n trading-saas -l app=trading-core-service -o wide

          echo ""
          echo "Waiting for all replicas to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=trading-core-service \
            -n trading-saas \
            --timeout=2m || true

          echo "✓ Pod status check complete"
