name: Fix Trading Signals Duplicate Key Errors

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'yes' to confirm you want to delete duplicate signals and restart pods"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix-duplicates:
    name: Delete duplicate signals and restart pods
    if: github.event.inputs.confirmation == 'yes'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Port-forward postgres and delete duplicate signals
        shell: bash
        run: |
          set -euo pipefail

          # Port-forward + psql in the SAME step. A background kubectl from a
          # previous step does not reliably survive into the next one on GH
          # Actions runners, which is why the prior split produced
          # "Connection refused" on localhost:5432. Mirror seed-market-data.yml:
          # single step, trap-based cleanup, non-default local port (5433).
          kubectl port-forward svc/postgres 5433:5432 -n trading-saas \
            >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true; wait "$PF_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1; then
              echo "✓ Port-forward ready on 127.0.0.1:5433"
              break
            fi
            if ! kill -0 "$PF_PID" 2>/dev/null; then
              echo "port-forward died early; see log:" >&2
              cat /tmp/pf.log >&2
              exit 1
            fi
            sleep 1
          done

          # Read credentials directly into local env — never via $GITHUB_OUTPUT
          # (outputs are logged when step-debug is on and persisted in the run).
          PGUSER=$(kubectl get secret postgres-credentials -n trading-saas \
            -o jsonpath='{.data.username}' | base64 -d)
          PGPASSWORD=$(kubectl get secret postgres-credentials -n trading-saas \
            -o jsonpath='{.data.password}' | base64 -d)
          export PGUSER PGPASSWORD
          export PGHOST=127.0.0.1
          export PGPORT=5433
          export PGDATABASE=trading_core

          echo "Deleting duplicate signals from trading_core.trading_signals..."
          psql -v ON_ERROR_STOP=1 << 'SQL'
          BEGIN;
          DELETE FROM trading_core.trading_signals
          WHERE id IN (
            SELECT id FROM (
              SELECT id, ROW_NUMBER() OVER (
                PARTITION BY ticker, signal_type, timeframe, DATE(generated_at), entry_price
                ORDER BY generated_at DESC
              ) AS rn
              FROM trading_core.trading_signals
            ) t WHERE rn > 1
          );
          COMMIT;
          SQL

          echo "✓ Duplicates deleted"

      - name: Restart trading-core-service deployment
        run: |
          set -euo pipefail
          echo "Restarting trading-core-service pods..."
          kubectl rollout restart deployment/trading-core-service -n trading-saas

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/trading-core-service -n trading-saas --timeout=5m

          echo "✓ Rollout complete"

      - name: Verify pods are healthy
        run: |
          set -euo pipefail
          echo "Checking pod status..."
          kubectl get pods -n trading-saas -l app=trading-core-service -o wide

          echo ""
          echo "Waiting for all replicas to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=trading-core-service \
            -n trading-saas \
            --timeout=2m || true

          echo "✓ Pod status check complete"
