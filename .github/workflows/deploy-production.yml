name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to deploy (defaults to the triggering commit)
        required: false
        type: string
      confirm:
        description: Type "deploy" to confirm production deployment
        required: true
        type: string

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      deploy-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation string must be 'deploy'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi

      - name: Resolve SHA
        id: resolve
        run: |
          set -euo pipefail
          SHA="${{ github.event.inputs.sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: validate
    permissions:
      contents: write
      packages: read
    secrets: inherit
    uses: ./.github/workflows/deploy-production-reusable.yml
    with:
      sha: ${{ needs.validate.outputs.deploy-sha }}
      environment: production
