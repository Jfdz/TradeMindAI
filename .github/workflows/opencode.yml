name: opencode-local-dual

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/oc')

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide model
        shell: bash
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" == *"/oc deep"* ]]; then
            echo "MODEL=ollama/qwen2.5-coder:14b" >> $GITHUB_ENV
          else
            echo "MODEL=ollama/qwen2.5-coder:7b" >> $GITHUB_ENV
          fi

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.MODEL }}
          use_github_token: true
          prompt: |
            You are a Senior Backend Java Engineer.

            Task:
            ${{ github.event.comment.body || github.event.inputs.task || 'Review repository' }}

            Rules:
            - Never merge automatically
            - If fixing issue:
            - create branch from develop
            - implement fix
            - open PR to develop
            - Focus on:
            - Spring Boot
            - Clean architecture
            - Null safety
            - Performance"