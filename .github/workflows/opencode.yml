      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: huggingface/zai-org/GLM-4.5-Air
          use_github_token: true
          prompt: |
            Read .opencode/context/instructions.md first.

            User request / GitHub event context:
            ${{ github.event.comment.body || github.event.inputs.task || 'Review the repository.' }}

            Execute the task safely.
            Never merge automatically.
            If fixing an issue, create a new branch from develop and open a PR targeting develop.