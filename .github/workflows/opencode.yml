name: opencode-local-dual

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  opencode:
    name: OpenCode Review / Fix / SonarQube Triage

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          startsWith(github.event.comment.body, '/oc') ||
          startsWith(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, ' /oc') ||
          contains(github.event.comment.body, ' /opencode')
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          startsWith(github.event.comment.body, '/oc') ||
          startsWith(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, ' /oc') ||
          contains(github.event.comment.body, ' /opencode')
        )
      )
        
    runs-on: self-hosted

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: develop

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Create OpenCode context folder
        run: mkdir -p .opencode/context
      - name: Capture SonarQube issues
        shell: bash
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          curl -sS -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false&ps=100" \
            -o .opencode/context/sonarqube-issues.json || true

          echo "SonarQube issues exported to .opencode/context/sonarqube-issues.json"
      - name: Build project context
        shell: bash
        run: |
          cat > .opencode/context/instructions.md <<'EOF'
          You are acting as a Senior Backend Java Engineer.

          Repository rules:
          - Target branch for generated fixes: develop.
          - Never merge automatically.
          - Never approve your own PR.
          - If fixing an issue, create a new branch from develop.
          - Implement the smallest safe change.
          - Add or update tests when possible.
          - Open a pull request targeting develop.
          - Explain clearly what was changed and why.

          PR review rules:
          - Review Java, Spring Boot, REST APIs, persistence, transactions, security, null safety, test coverage and clean architecture.
          - Classify findings as HIGH, MEDIUM or LOW.
          - Do not modify code during pure review unless explicitly requested.
          - Suggest exact files/classes/methods when possible.

          SonarQube rules:
          - Read .opencode/context/sonarqube-issues.json if present.
          - Group SonarQube issues by severity and component.
          - If requested, create GitHub issues for relevant SonarQube findings.
          - If requested to fix SonarQube issues, create a branch, fix them, add tests if needed, and open a PR to develop.
          EOF
      - name: Decide model
        shell: bash
        run: |
          COMMENT="${{ github.event.comment.body || github.event.inputs.task || '' }}"

          if [[ "$COMMENT" == *"/oc deep"* ]]; then
            echo "MODEL=ollama/qwen2.5-coder:7b" >> "$GITHUB_ENV"
          else
            echo "MODEL=ollama/qwen2.5-coder:3b" >> "$GITHUB_ENV"
          fi

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Configure OpenCode Ollama provider
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"

          printf '%s\n' \
            '{' \
            '  "$schema": "https://opencode.ai/config.json",' \
            '  "provider": {' \
            '    "ollama": {' \
            '      "npm": "@ai-sdk/openai-compatible",' \
            '      "name": "Ollama",' \
            '      "options": {' \
            '        "baseURL": "http://127.0.0.1:11434/v1",' \
            '        "apiKey": "ollama"' \
            '      },' \
            '      "models": {' \
            '        "qwen2.5-coder:3b": {' \
            '          "name": "qwen2.5-coder:3b"' \
            '        },' \
            '        "qwen2.5-coder:7b": {' \
            '          "name": "qwen2.5-coder:7b"' \
            '        }' \
            '      }' \
            '    }' \
            '  }' \
            '}' > "$HOME/.config/opencode/opencode.json"

          cat "$HOME/.config/opencode/opencode.json"
      - name: Warm up Ollama model
        shell: bash
        run: |
          echo "Warming up model..."
          ollama run qwen2.5-coder:3b "ping" || true
      - name: Protect workflow and context files from OpenCode changes
        shell: bash
        run: |
          git update-index --skip-worktree .github/workflows/opencode.yml || true
          git update-index --skip-worktree .github/workflows/trivy-scan.yml || true
          git update-index --skip-worktree .opencode/context/instructions.md || true
          git update-index --skip-worktree .opencode/context/sonarqube-issues.json || true
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.MODEL }}
          use_github_token: true
          prompt: |
            Read .opencode/context/instructions.md first.

            User request / GitHub event context:
            ${{ github.event.comment.body || github.event.inputs.task || 'Automatically review this pull request.' }}

            CRITICAL RULES:
            - This is a FIX task, not a summary task, if the request contains "fix", "sonar", "sonarqube", "sonarcloud", "refactor" or a file path.
            - Do NOT output internal tool calls, JSON tool messages, skill names, "caveman", "delivery-agent", or session metadata in the PR title, PR body, comments, or commits.
            - Do NOT modify workflow files.
            - Do NOT modify .opencode files.
            - Do NOT commit .opencode/context/instructions.md.
            - Do NOT commit .opencode/context/sonarqube-issues.json.
            - Modify only the affected application file unless another file is strictly required.

            Target file:
            All related files to the SonarCloud issues in .opencode/context/sonarqube-issues.json, if present.

            SonarQube task:
            - Read .opencode/context/sonarqube-issues.json.
            - Fix all the SonarCloud issues related.
            - Keep behaviour unchanged.
            - Do not perform broad formatting.
            - Do not refactor unrelated code.
            - Do not change CI/CD configuration.

            Commit rules:
            - Commit only relevant source-code changes.
            - Commit message must be:
              fix(portfolio): resolve SonarCloud issues in dashboard page

            Target branch:
            - All fix PRs MUST target develop.
            - Never open fix PRs against main.
            
            Pull request rules:
            - PR target branch must be develop.
            - PR title must be:
              fix(portfolio): resolve SonarCloud issues in dashboard page
            - PR body must contain:
              Summary:
              - Fixed SonarCloud issues.
              - Kept behaviour unchanged.
              - No workflow or generated context files changed.

              Validation:
              - Mention which checks were run, or explain if checks were not available.

              Closes #${{ github.event.issue.number || github.event.pull_request.number }}
      - name: Revert forbidden generated files
        if: always()
        shell: bash
        run: |
          git checkout -- .github/workflows/opencode.yml || true
          git checkout -- .github/workflows/trivy-scan.yml || true
          git checkout -- .opencode/context/instructions.md || true
          git checkout -- .opencode/context/sonarqube-issues.json || true