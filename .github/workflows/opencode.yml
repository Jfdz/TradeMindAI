name: opencode-local-dual

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/oc')

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide model
        shell: bash
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" == *"/oc deep"* ]]; then
            echo "MODEL=ollama/qwen2.5-coder:14b" >> $GITHUB_ENV
          else
            echo "MODEL=ollama/qwen2.5-coder:7b" >> $GITHUB_ENV
          fi

      - name: Run OpenCode
        shell: bash
        run: |
          opencode github run \
            --model "$MODEL" \
            --prompt "You are a Senior Backend Java Engineer.

            Task:
            ${{ github.event.comment.body || 'Review repository' }}

            Rules:
            - Never merge automatically
            - If fixing issue:
            - create branch from develop
            - implement fix
            - open PR to develop
            - Focus on:
            - Spring Boot
            - Clean architecture
            - Null safety
            - Performance"