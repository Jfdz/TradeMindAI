name: Deploy — Staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to deploy (leave empty to use latest built image)
        required: false
        type: string

jobs:
  resolve-sha:
    name: Resolve deploy SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      deploy-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGES="market-data-service trading-core-service ai-engine web-app"

          if [ -n "${INPUT_SHA}" ]; then
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No SHA provided — scanning last 30 commits for a complete image set..."
          for sha in $(git log --format='%H' -30); do
            found=true
            for image in ${IMAGES}; do
              if ! docker buildx imagetools inspect "${REPO}/${image}:${sha}" >/dev/null 2>&1; then
                found=false
                break
              fi
            done
            if [ "${found}" = "true" ]; then
              echo "Found complete image set at ${sha}"
              echo "sha=${sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ERROR: No commit in the last 30 has all 4 images in GHCR. Run CI workflows first."
          exit 1

  deploy:
    name: Deploy
    needs: resolve-sha
    permissions:
      contents: read
      packages: read
    secrets: inherit
    uses: ./.github/workflows/deploy-staging-reusable.yml
    with:
      sha: ${{ needs.resolve-sha.outputs.deploy-sha }}
