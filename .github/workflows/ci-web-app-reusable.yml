name: CI Reusable — web-app

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA or ref to checkout and build
        required: true
        type: string
      push_image:
        description: When false, build image but skip docker push
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency scan
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.trademind.es

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-app-test-results
          path: services/web-app/coverage/

  docker-build-push:
    name: Docker Build & Push
    needs: build-test
    runs-on: ubuntu-latest
    if: ${{ inputs.push_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image coordinates
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/web-app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.ref }}
            type=raw,value=latest,enable=${{ inputs.ref == github.sha && github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/web-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    needs: docker-build-push
    if: ${{ inputs.push_image }}
    permissions:
      contents: read
      actions: read
      security-events: write
    secrets: inherit
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ghcr.io/${{ github.repository }}/web-app:${{ inputs.ref }}
      dockerfile: services/web-app/Dockerfile
      context: services/web-app
