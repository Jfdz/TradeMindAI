name: Claude K8s Diagnostic

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'K8s command'
        required: true
        default: 'pods trading-core-service'

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Diagnostic output lands on a dedicated, unprotected branch:
          # both main and develop reject direct pushes via branch protection.
          # claude-diagnostic exists solely for this workflow — overwritten
          # every dispatch, never merged anywhere, never part of any CI path
          # filter.
          ref: claude-diagnostic
          fetch-depth: 1

      - name: Run diagnostic
        id: diag
        run: |
          # Do not let set -e swallow wrapper errors — the next step needs to
          # commit the file (including stderr) so we can see why a command
          # was rejected.
          /usr/local/bin/claude-k8s ${{ inputs.command }} > /tmp/diagnostic-output.txt 2>&1 || true
          cat /tmp/diagnostic-output.txt

      - name: Commit and push output
        if: always()
        run: |
          mkdir -p .github/.diagnostic
          cp /tmp/diagnostic-output.txt .github/.diagnostic/output.txt
          git config user.name "claude-bot"
          git config user.email "claude@anthropic.com"
          git add .github/.diagnostic/output.txt
          git commit -m "ci: k8s diagnostic output [skip ci]" || true
          git push origin HEAD:claude-diagnostic
