name: Claude K8s Diagnostic

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'K8s command'
        required: true
        default: 'pods trading-core-service'

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: Run diagnostic
        id: diag
        run: |
          echo "OUTPUT<<EOF" >> $GITHUB_OUTPUT
          /usr/local/bin/claude-k8s ${{ inputs.command }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post result as comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.diag.outputs.OUTPUT }}`;
            console.log(output);
            fs.writeFileSync('/tmp/claude-k8s-result.txt', output);
