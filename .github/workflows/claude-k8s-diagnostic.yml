name: Claude K8s Diagnostic

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'K8s command'
        required: true
        default: 'pods trading-core-service'

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Diagnostic output lands on develop because main is branch-
          # protected (no direct pushes). Develop is the conventional
          # next-up branch; Claude reads from origin/develop directly so
          # we do not block on a PR review cycle.
          ref: develop
          fetch-depth: 1

      - name: Run diagnostic
        id: diag
        run: |
          # Do not let set -e swallow wrapper errors — the next step needs to
          # commit the file (including stderr) so we can see why a command
          # was rejected.
          /usr/local/bin/claude-k8s ${{ inputs.command }} > /tmp/diagnostic-output.txt 2>&1 || true
          cat /tmp/diagnostic-output.txt

      - name: Commit and push output
        if: always()
        run: |
          mkdir -p .github/.diagnostic
          cp /tmp/diagnostic-output.txt .github/.diagnostic/output.txt
          git config user.name "claude-bot"
          git config user.email "claude@anthropic.com"
          git add .github/.diagnostic/output.txt
          # [skip ci] keeps per-service CI wrappers from firing on develop;
          # path filters protect against accidental triggers, but be explicit.
          git commit -m "ci: k8s diagnostic output [skip ci]" || true
          git push origin HEAD:develop
