name: CI Reusable — trading-core-service

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA or ref to checkout and build
        required: true
        type: string
      push_image:
        description: When false, build image but skip docker push
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trading-core-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading_core_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify -q
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trading_core_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-core-test-results
          path: services/trading-core-service/target/surefire-reports/

  docker-build-push:
    name: Docker Build & Push
    needs: build-test
    runs-on: ubuntu-latest
    if: ${{ inputs.push_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image coordinates
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/trading-core-service" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.ref }}
            type=raw,value=latest,enable=${{ inputs.ref == github.sha && github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/trading-core-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    needs: docker-build-push
    if: ${{ inputs.push_image }}
    secrets: inherit
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ghcr.io/${{ github.repository }}/trading-core-service:${{ inputs.ref }}
      dockerfile: services/trading-core-service/Dockerfile
      context: services/trading-core-service
