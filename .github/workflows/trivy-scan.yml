name: Trivy Image Scan (Reusable)

on:
  workflow_call:
    inputs:
      image-ref:
        description: Docker image tag to scan
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to repo root
        required: true
        type: string
      context:
        description: Docker build context path
        required: true
        type: string
    outputs:
      result:
        description: Scan result (success/failure)
        value: ${{ jobs.trivy.outputs.result }}

jobs:
  trivy:
    name: Trivy scan — ${{ inputs.image-ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    outputs:
      result: ${{ steps.set-result.outputs.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.69.3
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: Build image and save to tar
        env:
          IMAGE_REF: ${{ steps.normalize.outputs.image-ref }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          DOCKER_BUILDKIT: "0"
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_REF" -f "$DOCKERFILE" "$CONTEXT"
          docker save "$IMAGE_REF" -o "$GITHUB_WORKSPACE/scan-image.tar"
          ls -lh "$GITHUB_WORKSPACE/scan-image.tar"

      - name: Trivy scan (SARIF)
        run: |
          set -euo pipefail
          trivy image \
            --input "$GITHUB_WORKSPACE/scan-image.tar" \
            --format sarif --output trivy-results.sarif \
            --exit-code 0 --ignore-unfixed \
            --pkg-types os,library --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --skip-version-check

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ steps.normalize.outputs.image-ref }}

      - name: Trivy scan (table, gating)
        if: always()
        run: |
          set -euo pipefail
          trivy image \
            --input "$GITHUB_WORKSPACE/scan-image.tar" \
            --format table \
            --exit-code 1 --ignore-unfixed \
            --pkg-types os,library --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --skip-version-check

      - name: Cleanup tar
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/scan-image.tar"

      - name: Set result output
        id: set-result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"