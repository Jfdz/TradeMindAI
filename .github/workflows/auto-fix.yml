name: Auto Fix (Claude Code)

# Self-healing step of the autonomous pipeline.
#
# When any per-service CI fails on a feature/develop branch, Claude Code
# reads the failure logs, diagnoses the broken service, applies the
# smallest safe fix, and pushes it to the SAME branch. That push
# re-triggers CI; once green, the auto-merge armed by auto-pr.yml
# completes the chain. No human in the loop.
#
# Loop guard: if the last commit was itself an auto-fix and CI still
# fails, the job stops and comments instead of pushing again.

on:
  workflow_run:
    workflows:
      - "CI — web-app"
      - "CI — ai-engine"
      - "CI — trading-core-service"
      - "CI — market-data-service"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Diagnose and fix failing CI
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Loop guard — stop if last commit was an auto-fix
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_MSG="$(git log -1 --pretty=%s)"
          if echo "$LAST_MSG" | grep -q '\[auto-fix\]'; then
            echo "::warning::Last commit was already an auto-fix and CI still \
          fails. Stopping to avoid an infinite loop — needs human review."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture failure logs
        if: steps.guard.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/autofix-context
          gh run view "$WF_RUN_ID" \
            --log-failed > /tmp/autofix-context/ci-failure.log 2>&1 || true
          printf 'Workflow: %s\n' "$WF_NAME"   > /tmp/autofix-context/meta.txt
          printf 'Branch:   %s\n' "$WF_BRANCH" >> /tmp/autofix-context/meta.txt
          printf 'Run URL:  %s\n' "$WF_URL"    >> /tmp/autofix-context/meta.txt
          tail -c 20000 /tmp/autofix-context/ci-failure.log \
            > /tmp/autofix-context/ci-failure.tail.log || true

      - name: Setup Java
        if: steps.guard.outputs.stop == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node.js
        if: steps.guard.outputs.stop == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        if: steps.guard.outputs.stop == 'false'
        run: npm install -g bun

      - name: Claude Code — diagnose and fix
        if: steps.guard.outputs.stop == 'false'
        env:
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_NAME: ${{ github.event.workflow_run.name }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-haiku-4-5-20251001 --dangerously-skip-permissions"
          path_to_bun_executable: bun
          show_full_output: "true"
          prompt: |
            CI failed. Workflow name and target branch are in
            /tmp/autofix-context/meta.txt — read that file first.

            Your job: make CI green again with the smallest safe change.

            STEPS:
            1. Read /tmp/autofix-context/meta.txt and
               /tmp/autofix-context/ci-failure.tail.log (full log is
               ci-failure.log) to identify which service and which test /
               lint / build step failed.
            2. Locate the root cause in the affected service under
               services/<service>/. Reproduce the failing check locally
               when feasible (mvn verify, npm test, ruff, etc.).
            3. Apply the minimal fix. Keep behaviour unchanged unless the
               failure is a genuine bug. Add or update a test only if it
               is required to prove the fix.
            4. Stage ONLY the changed source files. Never stage anything
               under .github/, .claude/, or /tmp.
            5. Commit with a Conventional Commit message that ends with
               the marker " [auto-fix]", e.g.:
                 fix(ai-engine): clamp batch size to model capacity [auto-fix]
            6. Read the branch name from meta.txt, then push to that branch:
                 BRANCH=$(grep '^Branch:' /tmp/autofix-context/meta.txt | cut -d' ' -f2-)
                 git push origin "HEAD:$BRANCH"

            HARD RULES:
            - Do NOT modify any workflow file under .github/.
            - Do NOT modify .claude/ files.
            - Do NOT open a new branch or a new PR — push to the existing
              branch so the open PR re-runs CI and auto-merges when green.
            - Do NOT broaden scope or reformat unrelated code.
            - If the failure is environmental / flaky (not a code defect),
              do not change code: post a PR comment explaining why and stop.
