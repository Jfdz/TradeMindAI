name: CI — ai-engine

on:
  push:
    branches: [develop]
    paths:
      - 'services/ai-engine/**'
      - '.github/workflows/ci-ai-engine.yml'
      - '.github/workflows/ci-ai-engine-reusable.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/ai-engine/**'
      - '.github/workflows/ci-ai-engine.yml'
      - '.github/workflows/ci-ai-engine-reusable.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Ref/SHA to build (defaults to triggering ref)
        required: false
        type: string

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
    secrets: inherit
    uses: ./.github/workflows/ci-ai-engine-reusable.yml
    with:
      ref: ${{ github.event.inputs.ref || github.sha }}
      push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
