openapi: 3.0.3
info:
  title: trading-core-service
  description: |
    Identity, signals, strategies, subscriptions, backtests, and the
    internal BFF endpoints consumed by ai-engine.
  version: 0.1.0
servers:
  - url: http://localhost:8082
    description: Local dev
  - url: https://api.trademindai.local/trading-core
    description: Cluster-internal (staging/prod)

tags:
  - name: reasoning-context
    description: |
      Service-to-service endpoints consumed by ai-engine to assemble
      grounded reasoning contexts.

paths:
  /api/v1/internal/reasoning-context/{ticker}:
    get:
      tags: [reasoning-context]
      operationId: getReasoningContext
      summary: Assemble a grounded reasoning context for ai-engine.
      description: |
        Service-to-service BFF that combines `PriceFacts` from
        market-data with multi-provider aggregated news into a single
        payload for ai-engine's reasoning generation.

        Auth: requires `X-Internal-Secret`. JWT is not parsed for this
        path; the web app must never call this endpoint.

        Semantics:
        - `200` with full payload when both sub-fetches succeed.
        - `200` with `news=[]` and `errors=["news_aggregator_unavailable"]`
          when news fan-out fails (graceful degradation — price facts
          alone are still enough to surface a refusal in the LLM step).
        - `404` when market-data does not track the ticker at all.
        - `422` (INSUFFICIENT_HISTORY) when market-data has fewer than
          200 daily bars; ai-engine must treat this as a refusal signal.
        - `503` when market-data is unavailable for transport reasons.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9.\-]{1,10}$'
          example: META
        - name: newsHours
          in: query
          required: false
          description: Lookback window for ticker news (clamped to 1..168).
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 48
        - name: newsLimit
          in: query
          required: false
          description: Max news items to attach (clamped to 1..25).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 8
      responses:
        '200':
          description: Context assembled (possibly with degraded news).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasoningContextResponse'
        '401':
          description: Missing or invalid `X-Internal-Secret`.
        '404':
          description: Ticker not tracked by market-data.
        '422':
          description: Insufficient history to compute price facts.
        '503':
          description: market-data upstream unavailable.

  /api/v1/signals/{signalId}/deep-analysis:
    post:
      tags: [deep-analysis]
      operationId: generateDeepAnalysis
      summary: Generate and persist a premium multi-agent deep analysis for a signal.
      description: |
        PREMIUM-gated. Runs ai-engine's grounded bull/bear/judge/risk debate for
        the signal, persists the artifact (one per signal — regenerate replaces),
        and returns it. The debate is non-deterministic and explicitly *analysis,
        not an authoritative signal*: it never mutates the signal, but a verdict
        that contradicts the signal sets `conviction = CONTRADICTS` as a soft
        low-conviction review flag. Expensive (four sequential LLM calls) — on
        demand only, never auto-run per signal, never on read.
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deep analysis generated and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAnalysisResponse'
        '403':
          description: PREMIUM subscription required.
        '404':
          description: Signal not found.
        '503':
          description: |
            Deep analysis temporarily unavailable (no grounded facts, no verdict,
            or ai-engine unreachable). Nothing is persisted; retry later.
    get:
      tags: [deep-analysis]
      operationId: getDeepAnalysis
      summary: Return the stored deep analysis for a signal.
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored deep-analysis artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAnalysisResponse'
        '403':
          description: PREMIUM subscription required.
        '404':
          description: No deep analysis stored for this signal.

components:
  schemas:
    ReasoningContextResponse:
      type: object
      required: [ticker, generatedAt, priceFacts, news, errors]
      properties:
        ticker:
          type: string
          example: META
        generatedAt:
          type: string
          format: date-time
          description: When this context was assembled (used as audit timestamp).
        priceFacts:
          $ref: 'market-data-service.yaml#/components/schemas/PriceFactsResponse'
        news:
          type: array
          items:
            $ref: 'market-data-service.yaml#/components/schemas/NewsItemResponse'
        analystConsensus:
          allOf:
            - $ref: '#/components/schemas/AnalystConsensus'
          nullable: true
          description: |
            Latest analyst-recommendation snapshot (best-effort enrichment).
            Null when the provider returned nothing or failed. All counts are
            integers, so the downstream reasoning validator (which grounds only
            decimal tokens) lets the LLM cite them verbatim.
        recentPerformance:
          allOf:
            - $ref: '#/components/schemas/RecentPerformance'
          nullable: true
          description: |
            The ticker's recent resolved win/loss track record (best-effort
            deterministic reflection). Null when there is no resolved history.
            Integer counts only, so they are validator-safe to cite.
        insiderActivity:
          allOf:
            - $ref: '#/components/schemas/InsiderActivity'
          nullable: true
          description: |
            Aggregated recent insider-transaction activity (best-effort Fase 4
            enrichment). Null when there were no transactions or the provider
            failed. Integer counts only, so they are validator-safe to cite.
        socialSentiment:
          allOf:
            - $ref: '#/components/schemas/SocialSentiment'
          nullable: true
          description: |
            Aggregated recent social-media sentiment (best-effort Fase 4
            enrichment). Null when there were no mentions or the provider failed.
            Integer mention counts only (not decimal scores), so they are
            validator-safe to cite.
        errors:
          type: array
          description: |
            Non-fatal degradation tags surfaced to the caller for logging.
            Examples: `news_aggregator_unavailable`, `news_aggregator_empty`,
            `analyst_recs_unavailable`, `recent_performance_unavailable`,
            `insider_unavailable`, `sentiment_unavailable`.
          items:
            type: string
    AnalystConsensus:
      type: object
      required: [strongBuy, buy, hold, sell, strongSell, total]
      description: Latest analyst-recommendation counts from the enrichment provider.
      properties:
        period:
          type: string
          format: date
          nullable: true
          description: ISO date of the recommendation snapshot.
          example: 2026-05-01
        strongBuy:
          type: integer
          example: 12
        buy:
          type: integer
          example: 9
        hold:
          type: integer
          example: 3
        sell:
          type: integer
          example: 1
        strongSell:
          type: integer
          example: 1
        total:
          type: integer
          description: Sum of the five buckets.
          example: 26
    RecentPerformance:
      type: object
      required: [wins, losses, resolvedCount]
      description: |
        The ticker's recent resolved win/loss track record over the most
        recently evaluated signals (deterministic reflection). Integer counts.
      properties:
        wins:
          type: integer
          example: 7
        losses:
          type: integer
          example: 3
        resolvedCount:
          type: integer
          description: wins + losses (OPEN signals excluded).
          example: 10
    InsiderActivity:
      type: object
      required: [buyCount, sellCount, netShares]
      description: |
        Aggregated recent insider-transaction activity. Integer counts only
        (validator-safe). `buyCount` / `sellCount` count filings with a positive
        / negative share change; `netShares` is the signed sum.
      properties:
        buyCount:
          type: integer
          example: 7
        sellCount:
          type: integer
          example: 3
        netShares:
          type: integer
          format: int64
          example: 12345
    SocialSentiment:
      type: object
      required: [positiveMentions, negativeMentions, totalMentions]
      description: |
        Aggregated recent social-media sentiment as integer MENTION counts
        (deliberately not decimal scores, which the reasoning validator would
        reject as ungrounded numbers).
      properties:
        positiveMentions:
          type: integer
          example: 120
        negativeMentions:
          type: integer
          example: 35
        totalMentions:
          type: integer
          example: 180
    DeepAnalysisResponse:
      type: object
      required:
        [schemaVersion, outcome, ticker, signalType, generatedAt,
         verdictDirection, conviction, verdict, sections, provider, modelVersion]
      description: A grounded multi-agent deep-analysis artifact (analysis, not a signal).
      properties:
        schemaVersion:
          type: string
          example: v1.0
        outcome:
          type: string
          enum: [GENERATED, PARTIAL]
          description: PARTIAL = a verdict stands but at least one section was refused/withheld.
        ticker:
          type: string
          example: META
        signalType:
          type: string
          enum: [BUY, SELL, HOLD]
        generatedAt:
          type: string
          format: date-time
        verdictDirection:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        conviction:
          type: string
          enum: [AGREES, CONTRADICTS, UNCERTAIN]
          description: |
            How the debate verdict relates to the deterministic signal.
            CONTRADICTS is the soft low-conviction review flag; the signal is
            never mutated.
        verdict:
          $ref: '#/components/schemas/DeepAnalysisSection'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DeepAnalysisSection'
        provider:
          type: string
          example: minimax_oauth
        modelVersion:
          type: string
          example: MiniMax-M2.5-highspeed
    DeepAnalysisSection:
      type: object
      required: [role, text, priceRefs, newsRefs, refused]
      description: |
        One debate role's contribution. `text` is empty when `refused` (the
        model declined or the section failed grounding validation); the grounded
        numbers/URLs it cited are in priceRefs/newsRefs.
      properties:
        role:
          type: string
          enum: [BULL, BEAR, JUDGE, RISK]
        text:
          type: string
        priceRefs:
          type: array
          items:
            type: string
        newsRefs:
          type: array
          items:
            type: string
        refused:
          type: boolean
        refusalReason:
          type: string
          nullable: true
        validatorViolations:
          type: array
          items:
            type: object
            additionalProperties: true
