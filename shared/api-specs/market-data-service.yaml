openapi: 3.0.3
info:
  title: market-data-service
  description: |
    Time-series OHLCV, technical indicators, and grounded snapshots
    used by `ai-engine` (reasoning generation) and `trading-core-service`.
  version: 0.1.0
servers:
  - url: http://localhost:8081
    description: Local dev
  - url: https://api.trademindai.local/market-data
    description: Cluster-internal (staging/prod)

tags:
  - name: price-facts
    description: Deterministic price snapshots used as ground truth for AI reasonings.
  - name: news-aggregator
    description: Multi-provider ticker news with dedupe across sources.

paths:
  /api/v1/price-facts/{ticker}:
    get:
      tags: [price-facts]
      operationId: getPriceFacts
      summary: Get a deterministic price + indicator snapshot for a ticker.
      description: |
        Returns a point-in-time snapshot of price, return percentages,
        and technical indicators computed from `stock_prices`. Used by
        `ai-engine` as the only source of numeric truth when generating
        signal reasonings — values not present in this response MUST NOT
        appear in generated text.

        Determinism: same input data → same output. No wall-clock reads
        affect indicator math; `snapshotAt` reflects the latest bar's date.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9.\-]{1,10}$'
          example: META
        - name: timeframe
          in: query
          required: false
          description: Only `DAILY` is supported in v0.1.0.
          schema:
            type: string
            enum: [DAILY]
            default: DAILY
      responses:
        '200':
          description: Snapshot computed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceFactsResponse'
        '400':
          description: Invalid ticker format or unsupported timeframe.
        '404':
          description: Ticker not tracked, or no price history available.
        '422':
          description: |
            Insufficient history to compute the full snapshot
            (less than 200 daily bars — required for SMA200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientHistoryError'

  /api/v1/news-aggregated/{ticker}:
    get:
      tags: [news-aggregator]
      operationId: getAggregatedTickerNews
      summary: Get deduplicated ticker news across all registered providers.
      description: |
        Fans out to every `NewsProviderPort` implementation in parallel
        (Finnhub primary, Yahoo RSS secondary when enabled), dedupes by
        normalized URL keeping the higher-priority provider's copy on
        ties, sorts by `publishedAt` descending, and caches the response
        for 30 minutes.

        Graceful degradation: a single provider failure does not fail
        the response; the aggregator returns whatever the other providers
        produced. If all providers fail, returns an empty list.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9.\-]{1,10}$'
          example: PLTR
        - name: from
          in: query
          required: true
          description: ISO-8601 instant; lower bound of the news window.
          schema:
            type: string
            format: date-time
          example: '2026-05-01T00:00:00Z'
        - name: to
          in: query
          required: true
          description: ISO-8601 instant; upper bound of the news window.
          schema:
            type: string
            format: date-time
          example: '2026-05-13T00:00:00Z'
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (clamped to 1..50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: News items returned (possibly empty list).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NewsItemResponse'
        '400':
          description: Malformed `from`/`to` instants, or `from` after `to`.

components:
  schemas:
    PriceFactsResponse:
      type: object
      required:
        - ticker
        - timeframe
        - snapshotAt
        - close
        - barsAvailable
      properties:
        ticker:
          type: string
          example: META
        timeframe:
          type: string
          enum: [DAILY]
        snapshotAt:
          type: string
          format: date
          description: Date of the latest bar used in computation.
          example: '2026-05-12'
        barsAvailable:
          type: integer
          description: Number of bars in the lookback window.
          example: 252
        close:
          type: number
          format: double
          example: 603.00
        previousClose:
          type: number
          format: double
          nullable: true
        pctChange1d:
          type: number
          format: double
          nullable: true
          description: Percentage change vs previous close (e.g. 2.04 = +2.04%).
        pctChange5d:
          type: number
          format: double
          nullable: true
        pctChange30d:
          type: number
          format: double
          nullable: true
        high52w:
          type: number
          format: double
          nullable: true
        low52w:
          type: number
          format: double
          nullable: true
        sma20:
          type: number
          format: double
          nullable: true
        sma50:
          type: number
          format: double
          nullable: true
        sma200:
          type: number
          format: double
          nullable: true
          description: 'Null when fewer than 200 daily bars available.'
        rsi14:
          type: number
          format: double
          nullable: true
        macdHistogram:
          type: number
          format: double
          nullable: true
        volume:
          type: integer
          format: int64
          example: 12400000
        volumeAvg20d:
          type: number
          format: double
          nullable: true
        support:
          type: number
          format: double
          nullable: true
          description: 30-day rolling low (proxy support level).
        resistance:
          type: number
          format: double
          nullable: true
          description: 30-day rolling high (proxy resistance level).
    NewsItemResponse:
      type: object
      required: [id, headline, publishedAt, url]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Stable id for client-side pagination/dedupe. From Finnhub it
            is the original integer id; from Yahoo RSS it is a stable
            hash of the article URL.
        headline:
          type: string
        publishedAt:
          type: string
          format: date-time
          description: ISO-8601 instant.
        category:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
          nullable: true
          description: Cover image URL when the provider supplies one.
    InsufficientHistoryError:
      type: object
      required: [error, ticker, barsAvailable, barsRequired]
      properties:
        error:
          type: string
          enum: [INSUFFICIENT_HISTORY]
        ticker:
          type: string
        barsAvailable:
          type: integer
        barsRequired:
          type: integer
          example: 200
