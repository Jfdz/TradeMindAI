apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-service-config
  namespace: trading-saas
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
  LOGGING_LEVEL_ROOT: INFO
  APP_CORS_ALLOWED_ORIGINS: https://trademind.es

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-core-service-config
  namespace: trading-saas
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8082"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
  LOGGING_LEVEL_ROOT: INFO
  APP_CORS_ALLOWED_ORIGINS: https://trademind.es
  CLERK_ISSUER_URI: https://clerk.trademind.es
  CLERK_AUDIENCE: https://api.trademind.es
  SERVICES_MARKET_DATA_URL: http://market-data-service.trading-saas.svc.cluster.local:8081
  AI_ENGINE_SERVICE_URL: http://ai-engine.trading-saas.svc.cluster.local:8000
  MARKET_DATA_SERVICE_URL: http://market-data-service.trading-saas.svc.cluster.local:8081
  TRADING_CORE_ADMIN_EMAILS: noreply@trademind.es,demo@trademind.ai,jfdzn28@icloud.com

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-engine-config
  namespace: trading-saas
data:
  APP_ENV: production
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: INFO
  MODEL_PATH: /app/models
  PREDICTION_BATCH_SIZE: "32"
  CORS_ALLOWED_ORIGINS: https://trademind.es

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config
  namespace: trading-saas
data:
  NODE_ENV: production
  PORT: "3000"
  API_BASE_URL: http://trading-core-service.trading-saas.svc.cluster.local:8082
  AI_ENGINE_SERVICE_URL: http://ai-engine.trading-saas.svc.cluster.local:8000
  MARKET_DATA_SERVICE_URL: http://market-data-service.trading-saas.svc.cluster.local:8081
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/login
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/register
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
  NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
