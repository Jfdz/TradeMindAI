apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: trading-saas
  labels:
    app: ai-engine
    app.kubernetes.io/name: ai-engine
    app.kubernetes.io/component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ai-engine
          image: ghcr.io/jfdz/trademindai/ai-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY
            - name: LLM_PROVIDER
              # MiniMax via its Anthropic-compatible endpoint (Route A; spike
              # 2026-06-04 confirmed forced tool_choice works). The subscription
              # OAuth token is NOT a platform API key — accepted ToS/rate-limit
              # risk; the factory WARN-logs it on every init. Roll back by setting
              # this back to anthropic_api_key (ANTHROPIC_API_KEY above is kept
              # for exactly that). base_url + model use config defaults
              # (https://api.minimax.io/anthropic, MiniMax-M3).
              value: minimax_oauth
            - name: MINIMAX_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minimax-credentials
                  key: MINIMAX_OAUTH_TOKEN
            - name: TRADING_CORE_SERVICE_URL
              value: http://trading-core-service.trading-saas.svc.cluster.local:8082
            # C16 — single canonical env var name across all three services.
            # k8s mounts the `internal-service-secret/market-data` key as
            # INTERNAL_API_SECRET; pydantic-settings hydrates it into
            # Settings.internal_secret. Replacing the three per-service
            # *_INTERNAL_SECRET vars (TRADING_CORE_INTERNAL_SECRET,
            # MARKET_DATA_INTERNAL_SECRET, INTERNAL_SECRET) with this one
            # removes the two-Secret drift that 401d the reasoning pipeline
            # when a secret rotation hit only some deployments.
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: market-data
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: market-data-db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST)/$(DB_NAME)"
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: host
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST)"
            - name: MODEL_PATH
              value: /app/models
            - name: CORS_ALLOWED_ORIGINS
              value: https://trademind.es
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /app/models
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: ai-engine-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: trading-saas
  labels:
    app: ai-engine
spec:
  selector:
    app: ai-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-engine-models-pvc
  namespace: trading-saas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
