apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: trading-saas
  labels:
    app: web-app
    app.kubernetes.io/name: web-app
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web-app
          image: ghcr.io/jfdz/trademindai/web-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: publishable-key
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clerk-credentials
                  key: secret-key
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: API_BASE_URL
            - name: AI_ENGINE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: AI_ENGINE_SERVICE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-secret
                  key: secret
            - name: MARKET_DATA_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: MARKET_DATA_SERVICE_URL
            - name: MARKET_DATA_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: market-data
            - name: FINNHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finnhub-credentials
                  key: api-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: trading-saas
  labels:
    app: web-app
spec:
  selector:
    app: web-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
